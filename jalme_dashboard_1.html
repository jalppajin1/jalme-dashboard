<!DOCTYPE html>
<html lang="ko">

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#1a1a1a;--gold:#FFD700;--gold2:#cc8800;
  --red:#E24B4A;--blue:#378ADD;--green:#00a040;
  --bg:#fafaf8;--card:#ffffff;--border:#e8e8e8;
  --muted:#888;--light:#f4f4f0;
}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}

/* HEADER */
.site-header{background:var(--ink);color:#fff;padding:20px 24px;position:sticky;top:0;z-index:100;border-bottom:3px solid var(--gold)}
.header-inner{max-width:1100px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.logo{font-family:'Noto Serif KR',serif;font-size:18px;font-weight:700;color:var(--gold);letter-spacing:.05em}
.logo span{color:#fff;font-size:12px;font-weight:400;display:block;margin-top:2px;letter-spacing:.1em}
.header-meta{font-size:11px;color:rgba(255,255,255,.5);text-align:right}
.header-meta strong{color:var(--gold);display:block;font-size:14px}

/* TAB NAV */
.tab-nav{background:#fff;border-bottom:1px solid var(--border);position:sticky;top:69px;z-index:90;overflow-x:auto}
.tab-nav-inner{max-width:1100px;margin:0 auto;display:flex;gap:0}
.tab-btn{padding:14px 20px;border:none;background:none;font-family:'Noto Sans KR',sans-serif;font-size:12px;font-weight:700;color:var(--muted);cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent;transition:all .2s;flex-shrink:0}
.tab-btn:hover{color:var(--ink)}
.tab-btn.active{color:var(--ink);border-bottom-color:var(--gold)}
.tab-btn .rate{font-size:10px;margin-left:4px;padding:1px 5px;border-radius:10px;font-weight:700}
.rate-ok{background:#e8f8ee;color:var(--green)}
.rate-warn{background:#fffbe6;color:var(--gold2)}
.rate-bad{background:#fff0f0;color:var(--red)}

/* MAIN */
.main{max-width:1100px;margin:0 auto;padding:20px 16px 60px}

/* KPI ROW */
.kpi-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px 16px}
.kpi-label{font-size:10px;color:var(--muted);margin-bottom:6px;letter-spacing:.04em}
.kpi-val{font-size:22px;font-weight:900;line-height:1;color:var(--ink)}
.kpi-val span{font-size:13px;font-weight:400;color:var(--muted);margin-left:2px}
.kpi-sub{font-size:10px;color:#bbb;margin-top:4px}

/* CARD */
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px 20px;margin-bottom:14px}
.card-title{font-size:13px;font-weight:700;color:var(--ink);margin-bottom:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:700}
.badge-dark{background:var(--ink);color:var(--gold)}
.badge-green{background:#e8f8ee;color:var(--green)}
.badge-gray{background:#eee;color:#888}
.legend{display:flex;gap:14px;margin-bottom:10px;font-size:11px;color:var(--muted);flex-wrap:wrap}
.ld{width:10px;height:10px;border-radius:2px;display:inline-block;margin-right:4px;vertical-align:middle}

/* CHART WRAP */
.chart-wrap{position:relative;width:100%;height:300px}

/* TIER BARS */
.tier-item{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.tier-label{font-size:11px;color:#555;width:80px;flex-shrink:0;line-height:1.4}
.tier-bar-bg{flex:1;background:#f0f0f0;border-radius:4px;height:24px}
.tier-bar-fill{height:24px;border-radius:4px;display:flex;align-items:center;padding-left:10px;min-width:60px;transition:width .6s ease}
.tier-bar-fill span{font-size:12px;font-weight:800;color:#fff;white-space:nowrap}

/* INSIGHT */
.insight{border-radius:10px;padding:14px 16px;font-size:12px;line-height:1.9;margin-bottom:14px}
.insight.yellow{background:#fffbe6;border-left:4px solid var(--gold)}
.insight.red{background:#fff5f5;border-left:4px solid var(--red)}
.insight.green{background:#f0fff6;border-left:4px solid var(--green)}
.insight.blue{background:#f0f7ff;border-left:4px solid var(--blue)}

/* TABLE */
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tbl{width:100%;border-collapse:collapse;font-size:11px;min-width:520px}
.tbl thead tr{background:var(--ink);color:var(--gold)}
.tbl th{padding:8px 10px;font-weight:700;text-align:center;white-space:nowrap}
.tbl th:first-child{text-align:left}
.tbl td{padding:6px 10px;border-bottom:.5px solid #f2f2f2;text-align:center;vertical-align:middle}
.tbl td:first-child{text-align:left;font-weight:600;color:#444}
.tbl tr.we{background:#fffde8}
.tbl tr.hol td{color:#ccc}
.tbl tr:hover{background:#f9f9f6}
.bar-cell{display:flex;align-items:center;gap:6px}
.bar-bg{flex:1;background:#efefef;border-radius:3px;height:7px;min-width:40px;max-width:100px}
.bar-fill{height:7px;border-radius:3px}
.sal-val{font-size:11px;font-weight:800;min-width:40px;text-align:right;white-space:nowrap}
.rb{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11px;font-weight:700}

/* GRID 2COL */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}

/* SUMMARY TABLE */
.sum-tbl{width:100%;border-collapse:collapse;font-size:12px}
.sum-tbl th{background:#f4f4f0;padding:8px 12px;text-align:left;font-weight:700;font-size:11px;color:var(--muted);border-bottom:1px solid var(--border)}
.sum-tbl td{padding:10px 12px;border-bottom:.5px solid #f0f0f0;vertical-align:middle}
.sum-tbl tr:last-child td{border-bottom:none;font-weight:700;background:#fffbe6}

@media(max-width:640px){
  .kpi-row{grid-template-columns:repeat(2,1fr)}
  .grid2{grid-template-columns:1fr}
  .kpi-val{font-size:18px}
  .tab-btn{padding:12px 14px;font-size:11px}
  .chart-wrap{height:240px}
  .main{padding:14px 12px 60px}
}
</style>

function rs(r){
  if(!r)return{bg:'#f0f0f0',fc:'#ccc'};
  if(r<=5)return{bg:'#e8f8ee',fc:'#00a040'};
  if(r<=15)return{bg:'#ddeeff',fc:'#1a5fcc'};
  if(r<=40)return{bg:'#fffbe6',fc:'#cc8800'};
  if(r<=80)return{bg:'#fff0e0',fc:'#cc5500'};
  return{bg:'#fff0f0',fc:'#cc2222'};
}

let charts={};

// 주말 배경 플러그인
const weBgPlugin={
  id:'weBg',
  beforeDraw(chart){
    const{ctx,chartArea,scales}=chart;
    if(!chartArea||!scales.x)return;
    ctx.save();
    WE.forEach(idx=>{
      const x0=scales.x.getPixelForValue(idx);
      const x1=scales.x.getPixelForValue(idx+1);
      const bw=Math.abs(x1-x0);
      ctx.fillStyle='rgba(255,215,0,0.13)';
      ctx.fillRect(x0-bw/2,chartArea.top,bw,chartArea.bottom-chartArea.top);
    });
    ctx.restore();
  }
};

          <tr><td>🛤️ 서순라길</td><td>8,806만</td><td>9,716만</td><td><span class="rb" style="background:#e8f8ee;color:#00a040">91%</span></td><td>32위</td><td>✅ 연동</td><td>🌸 높음</td></tr>
          <tr><td>🏙️ 을지로</td><td>5,003만</td><td>5,096만</td><td><span class="rb" style="background:#e8f8ee;color:#00a040">98%</span></td><td>35위</td><td>➖ 독립</td><td>🌤 중간</td></tr>
          <tr><td>🏔️ 신용산</td><td>5,069만</td><td>4,520만</td><td><span class="rb" style="background:#e8f8ee;color:#00a040">112%</span></td><td>76위</td><td>➖ 독립</td><td>🌸 높음</td></tr>
          <tr><td>🎓 성신여대</td><td>2,292만</td><td>3,442만</td><td><span class="rb" style="background:#fff0f0;color:#cc2222">67%</span></td><td>55위</td><td>✅ 연동</td><td>🌤 중간</td></tr>
          <tr><td>🏟️ 올림픽공원</td><td>1,724만</td><td>3,332만</td><td><span class="rb" style="background:#fff0f0;color:#cc2222">52%</span></td><td>113위</td><td>✅ 연동</td><td>🌸 최고</td></tr>
          <tr style="background:#fffbe6;font-weight:700"><td>합계</td><td>30,980만</td><td>36,302만</td><td><span class="rb" style="background:#fffbe6;color:#cc8800">85%</span></td><td>—</td><td>—</td><td>—</td></tr>
        </tbody>
      </table></div>
    </div>

    <div class="insight yellow">
      <strong>💡 전체 인사이트 —</strong> 순위↔매출 연동이 명확한 지점(서촌·서순라·성신여대·올림픽)은 플레이스 작업이 직접 매출로 이어지는 구조. 을지로·신용산은 재방문 수요·광고가 순위를 대체하므로 별도 전략 필요. 4월은 봄 시즌 자연 유입 기대되나, 경쟁 매장도 동반 수혜를 받으므로 <strong>순위 관리를 병행해야 점유율을 지킬 수 있음.</strong>
    </div>
  `;

  charts.sum=new Chart(document.getElementById('c-sum'),{
    data:{
      labels:names,
      datasets:[
        {type:'bar',label:'3월 매출(만원)',data:totals,backgroundColor:rates.map(r=>r>=100?'rgba(0,160,64,.7)':r>=85?'rgba(55,138,221,.7)':r>=70?'rgba(204,136,0,.7)':'rgba(204,34,34,.7)'),yAxisID:'y',order:2},
        {type:'line',label:'달성률(%)',data:rates,borderColor:'#FFD700',backgroundColor:'rgba(255,215,0,.1)',pointBackgroundColor:rates.map(r=>r>=100?'#00a040':r>=85?'#378ADD':r>=70?'#cc8800':'#cc2222'),pointRadius:6,borderWidth:2.5,yAxisID:'y2',order:1}
      ]
    },
    options:{
      responsive:true,maintainAspectRatio:false,
      plugins:{legend:{position:'top',labels:{font:{size:11},boxWidth:12}},tooltip:{mode:'index',intersect:false}},
      scales:{
        y:{position:'left',ticks:{callback:v=>v+'만',font:{size:10}},grid:{color:'rgba(0,0,0,.04)'},title:{display:true,text:'매출(만원)',font:{size:10}}},
        y2:{position:'right',min:0,max:130,ticks:{callback:v=>v+'%',font:{size:10}},grid:{display:false},title:{display:true,text:'달성률(%)',font:{size:10}}}
      }
    }
  });
}

function renderStore(key){
  killCharts();
  const s=S[key];
  const maxS=Math.max(...s.sales);
  const validS=s.sales.filter(v=>v>0);
  const avgS=Math.round(validS.reduce((a,b)=>a+b,0)/validS.length);
  const totalO=s.orders.reduce((a,b)=>a+b,0);
  const vR=s.ranks.filter(r=>r);
  const avgR=vR.length?Math.round(vR.reduce((a,b)=>a+b,0)/vR.length):0;
  const rc=s.rate>=100?'#00a040':s.rate>=85?'#378ADD':s.rate>=70?'#cc8800':'#cc2222';

  let tierHTML='';
  if(s.corr){
    const T=[[],[],[],[]];
    s.ranks.forEach((r,i)=>{if(!r||s.sales[i]===0)return;const v=s.sales[i]/10000;if(r<=5)T[0].push(v);else if(r<=15)T[1].push(v);else if(r<=40)T[2].push(v);else T[3].push(v);});
    const avg=a=>a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):0;
    const ta=T.map(avg);const mx=Math.max(...ta.filter(Boolean))||1;
    const lb=['TOP 1~5위','6~15위','16~40위','41위 이하'];
    const bg=['#00a040','#378ADD','#cc8800','#cc2222'];
    tierHTML=`<div class="card"><div class="card-title"><span class="badge badge-dark">순위↔매출 상관관계</span> 순위 구간별 일평균 매출</div>
      ${lb.map((l,i)=>T[i].length?`<div class="tier-item">
        <div class="tier-label">${l}<br><span style="color:#bbb;font-size:10px">${T[i].length}일</span></div>
        <div class="tier-bar-bg"><div class="tier-bar-fill" style="width:${Math.round(ta[i]/mx*100)}%;background:${bg[i]}"><span>${ta[i]}만원</span></div></div>
      </div>`:'').join('')}
    </div>`;
  }

  document.getElementById('main').innerHTML=`
    <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;flex-wrap:wrap;gap:8px">
      <div>
        <div style="font-size:20px;font-weight:900;color:var(--ink)">${s.name} <span style="background:var(--gold);padding:1px 8px;border-radius:3px;font-size:12px;font-weight:700;color:var(--ink);margin-left:4px">3월 마케팅 보고서</span></div>
        <div style="font-size:11px;color:#aaa;margin-top:4px">${s.kw} · 월유입 ${s.inflow.toLocaleString()}건</div>
      </div>
      <div style="text-align:right">
        <div style="font-size:34px;font-weight:900;color:${rc};line-height:1">${s.rate}%</div>
        <div style="font-size:10px;color:#aaa">목표 달성률</div>
        <div style="font-size:10px;color:#888">${(s.total*10000).toLocaleString()}원 / ${(s.target*10000).toLocaleString()}원</div>
      </div>
    </div>

    <div class="kpi-row">
      <div class="kpi"><div class="kpi-label">3월 총매출</div><div class="kpi-val" style="color:${rc}">${s.total.toLocaleString()}<span>만</span></div><div class="kpi-sub">목표 ${s.target.toLocaleString()}만원</div></div>
      <div class="kpi"><div class="kpi-label">일평균 매출</div><div class="kpi-val">${Math.round(avgS/10000)}<span>만</span></div><div class="kpi-sub">최고 ${Math.round(maxS/10000)}만 (${s.sales.indexOf(maxS)+1}일)</div></div>
      <div class="kpi"><div class="kpi-label">총 결제건수</div><div class="kpi-val">${totalO.toLocaleString()}<span>건</span></div><div class="kpi-sub">일평균 ${Math.round(totalO/31)}건</div></div>
      <div class="kpi"><div class="kpi-label">평균 플레이스 순위</div><div class="kpi-val" style="color:${avgR<=15?'#00a040':avgR<=40?'#cc8800':'#cc2222'}">${avgR}<span>위</span></div><div class="kpi-sub">${s.kw}</div></div>
    </div>

    <div class="card">
      <div class="card-title">
        3월 일별 총매출 &amp; 플레이스 순위
        <span class="badge badge-dark">${s.kw}</span>
        ${s.corr?'<span class="badge badge-green">순위↔매출 연동</span>':'<span class="badge badge-gray">순위 독립구조</span>'}
      </div>
      <div class="legend">
        <span><span class="ld" style="background:#E24B4A"></span>총매출 (좌측·만원)</span>
        <span><span class="ld" style="background:#378ADD;border-radius:50%"></span>플레이스 순위 (우측·낮을수록 상위)</span>
        <span><span class="ld" style="background:rgba(255,215,0,0.4);border:1px solid #e0c800"></span>주말</span>
      </div>
      <div class="chart-wrap"><canvas id="c-main"></canvas></div>
    </div>

    ${tierHTML}
    <div class="insight ${s.ic}">${s.insight}</div>

    <div class="card">
      <div class="card-title">3월 일별 통합 현황</div>
      <div class="tbl-wrap"><table class="tbl">
        <thead><tr>
          <th style="text-align:left">날짜</th>
          <th style="width:40%">총매출</th>
          <th>결제건</th>
          <th>플레이스 순위</th>
          <th>순위변동</th>
          <th>매출변동</th>
        </tr></thead>
        <tbody id="tb"></tbody>
      </table></div>
    </div>
  `;

  // 메인 차트
  const salData=s.sales.map(v=>v>0?Math.round(v/10000*10)/10:null);
  const labels=Array.from({length:31},(_,i)=>`${i+1}(${DOW[i]})`);
  charts.main=new Chart(document.getElementById('c-main'),{
    plugins:[weBgPlugin],
    data:{labels,datasets:[
      {type:'line',label:'총매출(만원)',data:salData,borderColor:'#E24B4A',backgroundColor:'rgba(226,75,74,0.08)',borderWidth:2.5,
       pointBackgroundColor:salData.map((v,i)=>v===null?'transparent':WE.includes(i)?'#ff6b35':'#E24B4A'),
       pointBorderColor:'#fff',pointBorderWidth:1.5,pointRadius:salData.map(v=>v===null?0:4),
       tension:.35,yAxisID:'yL',spanGaps:false,fill:true,order:1},
      {type:'line',label:'플레이스 순위',data:s.ranks.map(r=>r||null),borderColor:'#378ADD',backgroundColor:'transparent',
       borderWidth:2,pointBackgroundColor:s.ranks.map(r=>r?rs(r).fc:'transparent'),
       pointBorderColor:'#fff',pointBorderWidth:1.5,pointRadius:s.ranks.map(r=>r?4:0),
       tension:.3,yAxisID:'yR',spanGaps:true,fill:false,order:0}
    ]},
    options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},
      plugins:{legend:{display:false},tooltip:{backgroundColor:'rgba(20,20,20,0.85)',padding:10,
        callbacks:{title:i=>`3월 ${i[0].label}`,label:ctx=>{
          if(ctx.dataset.label==='총매출(만원)'){const v=ctx.parsed.y;return v!=null?` 매출: ${v.toFixed(1)}만원`:' 매출: -';}
          return ctx.parsed.y!=null?` 순위: ${ctx.parsed.y}위`:' 순위: -';
        }}}},
      scales:{
        yL:{position:'left',beginAtZero:true,grid:{color:'rgba(0,0,0,.04)'},
            ticks:{callback:v=>v+'만',font:{size:10},color:'#cc3333'},
            title:{display:true,text:'← 매출(만원)',color:'#cc3333',font:{size:10,weight:'bold'}}},
        yR:{position:'right',reverse:true,beginAtZero:false,min:0,grid:{display:false},
            ticks:{callback:v=>v+'위',font:{size:10},color:'#2266cc'},
            title:{display:true,text:'순위(↑상위) →',color:'#2266cc',font:{size:10,weight:'bold'}}},
        x:{ticks:{font:{size:9},maxRotation:45,color:'#888'},grid:{display:false}}
      }
    }
  });

  // 테이블
  const tb=document.getElementById('tb');
  s.sales.forEach((sal,i)=>{
    const d=i+1;const isWE=WE.includes(i);const isHol=sal===0;
    const r=s.ranks[i];const rSt=rs(r);
    const prevR=i>0?s.ranks[i-1]:null;
    const rChg=(r&&prevR)?(prevR-r):null;
    const prevSal=i>0?s.sales[i-1]:null;
    const sChg=(prevSal!=null&&prevSal>0&&sal>0)?Math.round((sal-prevSal)/10000*10)/10:null;
    const pct=maxS>0?Math.round(sal/maxS*100):0;
    const bColor=sal>=3000000?'#00a040':sal>=1500000?'#378ADD':'#FFD700';
    const salM=(Math.round(sal/10000*10)/10).toFixed(1);
    const salColor=sal>=3000000?'#00a040':sal>=2000000?'#1a1a1a':sal>=1000000?'#cc8800':'#cc5500';
    tb.innerHTML+=`<tr class="${isHol?'hol':isWE?'we':''}">
      <td style="white-space:nowrap">${d}일 <span style="color:#bbb;font-size:10px">${DOW[i]}${isWE?' ★':''}</span></td>
      <td>${isHol?'<span style="color:#ddd">휴무</span>':`<div class="bar-cell">
        <div class="bar-bg"><div class="bar-fill" style="width:${pct}%;background:${bColor}"></div></div>
        <span class="sal-val" style="color:${salColor}">${salM}만</span>
      </div>`}</td>
      <td style="color:#777">${isHol?'-':s.orders[i]+'건'}</td>
      <td>${r?`<span class="rb" style="background:${rSt.bg};color:${rSt.fc}">${r}위</span>`:'<span style="color:#ddd">-</span>'}</td>
      <td style="font-size:10px;white-space:nowrap">${rChg!=null?`<span style="color:${rChg>0?'#00a040':rChg<0?'#cc2222':'#aaa'}">${rChg>0?'▲'+rChg:rChg<0?'▼'+Math.abs(rChg):'―'}</span>`:'<span style="color:#ddd">-</span>'}</td>
      <td style="font-size:10px;white-space:nowrap">${sChg!=null?`<span style="color:${sChg>0?'#00a040':'#cc2222'}">${sChg>0?'+':''}${sChg.toFixed(1)}만</span>`:'<span style="color:#ddd">-</span>'}</td>
    </tr>`;
  });
}

document.querySelectorAll('.tab-btn').forEach(t=>{
  t.addEventListener('click',function(){
    document.querySelectorAll('.tab-btn').forEach(x=>x.classList.remove('active'));
    this.classList.add('active');
    const key=this.dataset.key;
    if(key==='summary') renderSummary();
    else renderStore(key);
  });
});
renderSummary();
</script>
</body>
</html>
